<!DOCTYPE html>
<html lang="en">
    <head>
<title>Product Card</title>
<link rel="stylesheet" href="style.css">
    </head>
    <body>
<div class="product-card">
    <img src="images/shoe1.jpeg" alt="Classic Sneakers">
    <h2>Classic Sneakers</h2>
    <p class="price">$79.99</p>
    <p class="sale-badge">SALE</p>
    <p class="shipping">Free Shipping</p>
    <p class="rating">★★★★☆ 4.2 (128 reviews)</p>
    <p class="description">everyday sneakers with a clean and classic design.</p>
    <p class="stock">In Stock</p>
    <button>Add to Cart</button>
</div>
    </body>
</html>
